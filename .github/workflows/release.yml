# Automated npm publishing for the @ventostack/* napi packages, following the
# changesets flow from the VentoStack repo: pushes to main with pending
# changesets open a "Version Packages" PR; merging that PR (no pending
# changesets left) triggers the cross-platform build matrix and publishes.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "bindings/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".changeset/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        id: changesets
        with:
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build addons (${{ matrix.settings.target }})
    needs: changesets
    if: needs.changesets.outputs.hasChangesets == 'false'
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            host: macos-latest
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-pc-windows-msvc
            host: windows-latest
          # napi-cross links the gnu builds against glibc 2.17 so the binaries
          # run on old distros regardless of the build host's glibc.
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            build-args: --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            build-args: --use-napi-cross
            # The napi-cross aarch64 gcc does not predefine __ARM_ARCH, which
            # ring's pregenerated ARM asm requires; inject it manually.
            cflags: -D__ARM_ARCH=8
          # musl targets cross-compile with the Zig toolchain.
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            build-args: --cross-compile
            zig: true
          - target: aarch64-unknown-linux-musl
            host: ubuntu-latest
            build-args: --cross-compile
            zig: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.settings.zig == true
        with:
          version: 0.14.1
      - run: bun install --frozen-lockfile
      - name: Build file-parser
        working-directory: packages/file-parser
        run: npm run build -- --target ${{ matrix.settings.target }} ${{ matrix.settings.build-args || '' }}
        env:
          CFLAGS: ${{ matrix.settings.cflags }}
      - name: Build vm-runtime
        working-directory: packages/vm-runtime
        run: npm run build -- --target ${{ matrix.settings.target }} ${{ matrix.settings.build-args || '' }}
        env:
          CFLAGS: ${{ matrix.settings.cflags }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-file-parser-${{ matrix.settings.target }}
          path: packages/file-parser/*.node
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-vm-runtime-${{ matrix.settings.target }}
          path: packages/vm-runtime/*.node
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    strategy:
      fail-fast: false
      matrix:
        package: [file-parser, vm-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-${{ matrix.package }}-*
          path: packages/${{ matrix.package }}/artifacts
      - name: Populate platform packages
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run create-npm-dirs
          npm run artifacts
      - name: Skip if this version is already on npm
        id: probe
        working-directory: packages/${{ matrix.package }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Probe the versioned packument directly: the root packument that
          # `npm view` fetches stays CDN-stale for a while after publishing.
          url="https://registry.npmjs.org/${name//\//%2F}/$version"
          if curl -fsSL -o /dev/null "$url"; then
            echo "$name@$version is already published; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.probe.outputs.published == 'false'
        working-directory: packages/${{ matrix.package }}
        # prepublishOnly runs `napi prepublish`, which stamps and publishes
        # the per-platform packages (@ventostack/*-<platform>) and fills
        # optionalDependencies before the main package goes out.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
