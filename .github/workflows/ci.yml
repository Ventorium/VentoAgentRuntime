name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --lib --bins -- -D warnings
      - run: cargo test --workspace
      - name: Reject high-level conversion dependencies
        run: '! cargo tree | grep -E "(^| )((anydoc|pdf-inspector|liteparse) )"'
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Package changes must ship a changeset, otherwise they never reach npm.
  # The changesets-action version PRs do not run this check (events raised by
  # GITHUB_TOKEN trigger no workflows).
  changesets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: packages/ changes require a changeset
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(packages|bindings)/' || exit 0
          compgen -G '.changeset/*.md' > /dev/null && exit 0
          echo '::error::Changes under packages/ or bindings/ must include a changeset (bunx changeset).'
          exit 1
