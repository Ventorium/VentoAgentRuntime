[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "anydoc", reason = "source is owned in-tree" },
  { name = "pdf-inspector", reason = "source is owned in-tree" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

