[workspace]
resolver = "2"
members = [
  "crates/runtime-types",
  "crates/pdf-engine",
  "crates/document-runtime",
  "crates/document-providers",
  "crates/agent-protocol",
  "crates/vm-runtime",
  "crates/firecracker-runtime",
  "bindings/document-napi",
  "bindings/vm-napi",
  "bins/vento-runtime-server",
  "bins/vento-runtime-cli",
  "bins/agentd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Ventorium/VentoAgentRuntime"

[workspace.dependencies]
async-trait = "=0.1.89"
axum = { version = "=0.8.8", features = ["json", "query"] }
base64 = "=0.22.1"
calamine = { version = "=0.36.1", features = ["dates"] }
cfb = "=0.14.0"
clap = { version = "=4.6.0", features = ["derive", "env"] }
encoding_rs = "=0.8.35"
env_logger = "=0.11.11"
flate2 = "=1.1.9"
libc = "=0.2.184"
log = "=0.4.33"
lopdf = { version = "=0.42.0", features = ["rayon"] }
napi = { version = "=3.12.1", default-features = false, features = ["napi4", "serde-json", "tokio_rt"] }
napi-build = "=2.4.1"
napi-derive = "=3.6.3"
nix = { version = "=0.30.1", features = ["fs", "process", "resource", "sched", "signal", "socket", "user"] }
once_cell = "=1.21.4"
quick-xml = "=0.41.0"
rayon = "=1.12.0"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.51.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.6.8", features = ["limit", "request-id", "trace"] }
ttf-parser = "=0.25.1"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.23.0", features = ["serde", "v7"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
