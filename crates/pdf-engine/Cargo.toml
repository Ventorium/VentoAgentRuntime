[package]
name = "vento-pdf-engine"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

[lib]
name = "vento_pdf_engine"

[dependencies]
env_logger.workspace = true
log.workspace = true
lopdf.workspace = true
once_cell.workspace = true
rayon.workspace = true
regex.workspace = true
thiserror = "=2.0"
ttf-parser.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
# Reserved upstream feature flag. The vision OCR backend was excluded from this
# port (OCR is delegated to the remote provider in vento-file-parser), but the
# `#[cfg(feature = "ocr")]` plumbing is kept so the crate stays diff-clean
# against upstream. Enabling this flag does not restore OCR.
ocr = []
